name: Tests

on:
  push:
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - 'docs/*'
  pull_request:
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - 'docs/*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        nim-version: ['stable']
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the benchmarks build the baseline commit's src/.
          fetch-depth: 0

      - name: Setup nim environment
        uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: ${{ matrix.nim-version }}

      - name: Setup Vecs
        run: nimble install cborious

      - name: Running tests
        run: |
          testament cat /
          nim c -r -d:ArchetypeWords=2 "tests/manycomponents.nim"

      # Both runs happen on this runner, back to back, so the comparison is not at the
      # mercy of whichever machine produced a stored baseline days ago.
      - name: Running benchmarks against the baseline commit
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Compare against the tip of the branch the PR targets, not the PR's own parent.
            git fetch --quiet origin "${{ github.base_ref }}"
            baseline="origin/${{ github.base_ref }}"
          else
            baseline="HEAD^"
          fi

          if ! git rev-parse --verify --quiet "$baseline^{commit}" > /dev/null; then
            echo "No baseline commit at $baseline, benchmarking without a comparison."
            nim c -r -d:danger --nimcache:nimcache/current "benchs/vecs_bench.nim" current.csv
            exit 0
          fi

          echo "Baseline: $baseline ($(git rev-parse --short "$baseline"))"

          # Only src/ is taken from the baseline commit. The harness and the benchmark
          # definitions stay at their current version, so the two runs measure the same
          # thing and only the library under test changes.
          git checkout "$baseline" -- src
          nim c -r -d:danger --nimcache:nimcache/baseline "benchs/vecs_bench.nim" baseline.csv || rm -f baseline.csv
          git checkout HEAD -- src

          if [ ! -f baseline.csv ]; then
            echo "Baseline src/ did not build against the current benchmarks, skipping comparison."
          fi

          nim c -r -d:danger --nimcache:nimcache/current "benchs/vecs_bench.nim" current.csv baseline.csv
